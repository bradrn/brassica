  - contents: |
      cabal-version:      2.0
      name:               brassica
      version:            1.1.0
      synopsis:           Featureful sound change applier
      description:
        This is the Brassica library for the simulation of sound changes in historical linguistics and language construction.
        .
        For an introduction to library usage, see the documentation of [Brassica.SoundChange](https://hackage.haskell.org/package/brassica-1.1.0/candidate/docs/Brassica-SoundChange.html).
        .
        For further details on Brassica’s design and usage, please refer to the README below or at <https://github.com/bradrn/brassica/blob/v1.1.0#readme>.

      category:           Linguistics
      homepage:           https://bradrn.com/brassica
      bug-reports:        https://github.com/bradrn/brassica/issues
      author:             Brad Neimann
      maintainer:         Brad Neimann
      copyright:          2020-2022 Brad Neimann
      license:            BSD3
      license-file:       LICENSE
      build-type:         Simple
      extra-doc-files:
        README.md
        ChangeLog.md

      source-repository head
        type:     git
        location: https://github.com/bradrn/brassica

      library
        exposed-modules: Brassica.SoundChange
                       , Brassica.SoundChange.Apply
                       , Brassica.SoundChange.Apply.Internal
                       , Brassica.SoundChange.Apply.Internal.MultiZipper
                       , Brassica.SoundChange.Expand
                       , Brassica.SoundChange.Frontend.Internal
                       , Brassica.SoundChange.Parse
                       , Brassica.SoundChange.Tokenise
                       , Brassica.SoundChange.Types
                       , Brassica.SFM.MDF
                       , Brassica.SFM.SFM
                       , Brassica.Paradigm
        other-modules:   Brassica.Paradigm.Apply
                       , Brassica.Paradigm.Parse
                       , Brassica.Paradigm.Types
        hs-source-dirs:   src
        ghc-options:      -Wall
        build-depends:
                         base >=4.7 && <5
                       , aeson >=2.2 && <2.4
                       , containers >=0.6 && <0.7
                       , deepseq >=1.4 && <1.6
                       , fast-myers-diff >=0.0.0 && <0.1
                       , megaparsec >=8.0 && <9.9
                       , mtl >=2.2 && <2.4
                       , parallel >=3.2 && <3.4
                       , parser-combinators >=1.2 && <1.4
                       , split >=0.2 && <0.3
                       , text >=1.2 && <2.3
                       , transformers >=0.5 && <0.7
                       , vector >=0.13 && <0.14

        default-language: Haskell2010

      executable brassica
        main-is:          Main.hs
        other-modules:    Server
        hs-source-dirs:   cli
        ghc-options:      -threaded -rtsopts -with-rtsopts=-N -Wall
        build-depends:
                          base >=4.7 && <5
                        , brassica
                        , aeson >=2.2 && <2.4
                        , attoparsec-aeson ^>=2.2
                        , bytestring >=0.10 && <0.13
                        , conduit ^>=1.3
                        , conduit-extra ^>=1.3
                        , deepseq >=1.4 && <1.6
                        , optparse-applicative >=0.17.1 && <0.20
                        , text >=1.2 && <2.3

        default-language: Haskell2010

      executable brassica-pb
        main-is:          Main.hs
        hs-source-dirs:   cli-pb
        ghc-options:      -threaded -rtsopts -with-rtsopts=-N -Wall
        build-depends:
                          base >=4.7 && <5
                        , brassica
                        , bytestring >=0.10 && <0.13
                        , conduit ^>=1.3
                        , optparse-applicative >=0.17.1 && <0.20
                        , text >=1.2 && <2.3

        default-language: Haskell2010

      benchmark changes-bench
        type:             exitcode-stdio-1.0
        main-is:          Changes.hs
        hs-source-dirs:   bench
        ghc-options:      -threaded -rtsopts -with-rtsopts=-N -Wall
        build-depends:
                          base >=4.7 && <5
                        , brassica
                        , criterion >=1.5 && <1.7
                        , file-embed >=0.0.15 && <0.0.17
                        , parallel >=3.2 && <3.4
                        , text >=1.2 && <2.3

        default-language: Haskell2010

      benchmark paradigm-bench
        type:             exitcode-stdio-1.0
        main-is:          Paradigm.hs
        hs-source-dirs:   bench
        ghc-options:      -threaded -rtsopts -with-rtsopts=-N -Wall
        build-depends:
                          base >=4.7 && <5
                        , brassica
                        , criterion >=1.5 && <1.7

        default-language: Haskell2010

      test-suite changes-test
        type:             exitcode-stdio-1.0
        main-is:          Spec.hs
        hs-source-dirs:   test
        ghc-options:      -threaded -rtsopts -with-rtsopts=-N -Wall
        build-depends:
                          base >=4.7 && <5
                        , brassica
                        , tasty >=1.4 && <1.6
                        , tasty-golden ^>=2.3
                        , bytestring
                        , text >=1.2 && <2.3
                        , transformers >=0.5 && <0.7
                        , conduit ^>=1.3
                        , utf8-string ^>=1.0

        default-language: Haskell2010

      test-suite doctests
        type:             exitcode-stdio-1.0
        main-is:          DocTests.hs
        hs-source-dirs:   test
        ghc-options:      -threaded -rtsopts -with-rtsopts=-N -Wall
        build-depends:
                          base >=4.7 && <5
                        , brassica
                        , tasty >=1.4 && <1.6
                        , bytestring
                        , text >=1.2 && <2.3
                        , pandoc >=3.3 && <3.13
                        , pandoc-types >=1.23 && <1.24

        default-language: Haskell2010
    dest: local/brassica
    dest-filename: brassica.cabal
    type: inline
  - contents: |
      repository vendored
        url: file+noindex:///app/lib/haskell-repo

      store-dir: /app/lib/cabal-store
    dest-filename: cabal.config
    type: inline
  - contents: |
      constraints: any.Glob ==0.10.2, any.OneTuple ==0.4.3, any.Only ==0.1, any.QuickCheck ==2.19.0.0, any.StateVar ==1.2.2, any.aeson ==2.3.2.0, any.ansi-terminal ==1.1.5, any.ansi-terminal-types ==1.1.3, any.array installed, any.assoc ==1.1.1, any.async ==2.2.6, any.attoparsec ==0.14.4, any.attoparsec-aeson ==2.2.2.0, any.base installed, any.base-compat ==0.15.0, any.base-compat-batteries ==0.15.0, any.base-orphans ==0.9.4, any.bifunctors ==5.6.3, any.binary ==0.8.9.3, any.binary-orphans ==1.0.6, any.bitvec ==1.1.6.0, any.bytestring installed, any.case-insensitive ==1.2.2.0, any.cassava ==0.5.4.1, any.character-ps ==0.1, any.code-page ==0.2.1, any.colour ==2.3.7, any.comonad ==5.0.10, any.conduit ==1.3.6.1, any.conduit-extra ==1.3.8, any.containers ==0.6.8, any.contravariant ==1.5.6, any.criterion ==1.6.5.0, any.criterion-measurement ==0.2.5.0, any.data-default ==0.8.0.2, any.data-default-class ==0.2.0.0, any.data-fix ==0.3.4, any.deepseq installed, any.dense-linear-algebra ==0.1.0.0, any.directory installed, any.distributive ==0.6.3, any.dlist ==1.0, any.exceptions installed, any.fast-myers-diff ==0.0.2, any.file-embed ==0.0.16.0, any.file-io installed, any.filepath installed, any.ghc-bignum installed, any.ghc-boot-th installed, any.ghc-internal installed, any.ghc-prim installed, any.hashable ==1.5.1.0, any.hsc2hs ==0.68.10, any.indexed-traversable ==0.1.5, any.indexed-traversable-instances ==0.1.2.1, any.integer-conversion ==0.1.1, any.integer-logarithms ==1.0.5, any.js-chart ==2.9.4.1, any.math-functions ==0.3.4.4, any.megaparsec ==9.8.3, any.microstache ==1.0.3.1, any.mono-traversable ==1.0.21.0, any.mtl installed, any.mwc-random ==0.15.3.0, any.network ==3.2.13.0, any.network-uri ==2.6.4.2, any.optparse-applicative ==0.19.0.0, any.os-string installed, any.parallel ==3.3.0.0, any.parsec ==3.1.18.0, any.parser-combinators ==1.3.1, any.pretty installed, any.prettyprinter ==1.7.2, any.prettyprinter-ansi-terminal ==1.1.4, any.primitive ==0.9.1.0, any.process installed, any.random ==1.3.1, any.resourcet ==1.3.0, any.rts installed, any.scientific ==0.3.10.0, any.semialign ==1.4, any.semigroupoids ==6.0.2, any.split ==0.2.5.1, any.splitmix ==0.1.3.2, any.statistics ==0.16.5.0, any.stm installed, any.streaming-commons ==0.2.3.1, any.strict ==0.5.1, any.system-cxx-std-lib installed, any.tagged ==0.8.11, any.tasty ==1.5.5, any.template-haskell installed, any.template-haskell-lift installed, any.terminal-size ==0.3.4, any.text ==2.1.4, any.text-iso8601 ==0.2.0.0, any.text-short ==0.1.6.1, any.th-abstraction ==0.7.2.0, any.th-compat ==0.1.7, any.these ==1.2.1, any.time installed, any.time-compat ==1.9.9, any.transformers installed, any.transformers-compat ==0.8, any.typed-process ==0.2.13.0, any.unix installed, any.unliftio-core ==0.2.1.0, any.unordered-containers ==0.2.21, any.uuid-types ==1.0.6.1, any.vector ==0.13.2.0, any.vector-algorithms ==0.9.1.0, any.vector-binary-instances ==0.2.5.2, any.vector-stream ==0.1.0.1, any.vector-th-unbox ==0.2.2, any.witherable ==0.5, any.zlib ==0.7.1.1

      package OneTuple
        flags: +base-ge-4-15 +base-ge-4-16

      package QuickCheck
        flags: -old-random +templatehaskell

      package aeson
        flags: +ordered-keymap

      package ansi-terminal
        flags: -example

      package assoc
        flags: -tagged

      package async
        flags: -bench -debug-auto-label

      package attoparsec
        flags: -developer

      package bifunctors
        flags: +tagged

      package binary-orphans
        flags: +base-ge-4-16 +base-ge-4-17

      package bitvec
